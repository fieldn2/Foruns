<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fóruns do TJDFT – Distâncias de carro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--panel:#000000;--line:#2a2a2a;--text:#f1f1f1;--muted:#a0a0a0;--accent:#1a73e8;--a:#22c55e;--b:#ef4444;--ctl:#141414;--card:#0d0d0d;--card2:#000000;--link:#8ab4f8;--lbl:#fff;--halo:#000}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:var(--panel);color:var(--text)}
  .app{display:grid;grid-template-columns:350px 1fr;height:100vh}
  @media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 75vh;height:auto}}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto;z-index:2}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.4}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .sel{display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  select{flex:1;min-width:0;background:var(--ctl);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{background:var(--ctl);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#8ab4f8}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .result{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .big{font-size:38px;font-weight:700;line-height:1}
  .big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px}
  .stat b{display:block;font-size:18px}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .via{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
  .gm{display:inline-block;margin-top:12px;color:var(--link);font-size:13px;text-decoration:none}
  .gm:hover{text-decoration:underline}
  .loading{color:var(--muted);font-size:13px}
  .near{margin-top:18px}
  .near h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .near ul{padding:0;margin:0}
  .near li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:6px;font-size:13.5px;cursor:pointer}
  .near li:hover{background:var(--ctl)}
  .near li span:last-child{color:var(--muted);white-space:nowrap}
  .note{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.5}
  #map{height:100%;width:100%;background:#111}
  body.light #map{background:#e8eee4}
  .theme{width:100%;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
  .dk-topo{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(1.05)}
  /* marcadores no estilo do Google Maps */
  .pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-14px);white-space:nowrap;cursor:pointer}
  .pin .pill{background:#0b0f12;color:#fff;font-weight:600;font-size:12px;padding:5px 10px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.45);border:2px solid #000}
  .pin .lbl{margin-top:3px;font-size:11.5px;font-weight:700;color:var(--lbl);text-shadow:-1.5px -1.5px 0 var(--halo),1.5px -1.5px 0 var(--halo),-1.5px 1.5px 0 var(--halo),1.5px 1.5px 0 var(--halo),0 -1.5px 0 var(--halo),0 1.5px 0 var(--halo),-1.5px 0 0 var(--halo),1.5px 0 0 var(--halo),0 0 4px var(--halo)}
  .pin.a .pill{background:var(--a)} .pin.b .pill{background:var(--b)}
  .pin.dim{opacity:.5}
  .leaflet-div-icon{background:none;border:none}
  .route-tag{display:inline-block;background:#8ab4f8;color:#000;border:2px solid #000;font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%)}
  .leaflet-control-layers{font-family:Inter,system-ui,sans-serif}
</style>
</head>
<body>
<div class="app">
  <aside>
    <button class="theme" id="theme"></button>
    <h1>Fóruns do TJDFT</h1>
    <p class="sub">Escolha dois fóruns para ver a rota.</p>

    <label>Origem</label>
    <div class="sel"><span class="dot" style="background:var(--a)"></span><select id="selA"></select></div>
    <label>Destino</label>
    <div class="sel"><span class="dot" style="background:var(--b)"></span><select id="selB"></select></div>
    <div class="row"><button id="clear">Limpar</button><button id="fit">Ver todos</button></div>
    <div class="hint" id="hint"></div>

    <div class="result" id="result" hidden>
      <div id="resBody"></div>
      <a class="gm" id="gm" href="#" target="_blank" rel="noopener">Abrir o Google Maps ↗</a>
    </div>

    <div class="near" id="near" hidden>
      <h2 id="nearTitle"></h2>
      <ul id="nearList"></ul>
    </div>

  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FORUNS = [
  {id:'brz', nome:'Fórum de Brazlândia',        lat:-15.68069, lng:-48.20394, r:4.3},
  {id:'sob', nome:'Fórum de Sobradinho',        lat:-15.65119, lng:-47.79306, r:4.2},
  {id:'pla', nome:'Fórum de Planaltina',        lat:-15.61781, lng:-47.65406, r:4.5},
  {id:'vij', nome:'Fórum VIJ',                  lat:-15.73906, lng:-47.90444, r:4.8},
  {id:'909', nome:'Fórum 909',                  lat:-15.76269, lng:-47.89581, r:5.0},
  {id:'ita', nome:'Fórum do Itapoã',            lat:-15.73806, lng:-47.76706, r:4.0},
  {id:'par', nome:'Fórum do Paranoá',           lat:-15.78019, lng:-47.78369, r:4.1},
  {id:'sede',nome:'Fórum Milton Sebastião Barbosa (SEDE)', lat:-15.78819, lng:-47.90881, r:null, tag:'SEDE'},
  {id:'nac', nome:'Fórum NAC',                  lat:-15.80919, lng:-47.92944, r:null},
  {id:'gua', nome:'Fórum do Guará',             lat:-15.82481, lng:-47.97331, r:4.3},
  {id:'des', nome:'Fórum Júlio Leal Fagundes',  lat:-15.83019, lng:-47.94419, r:3.8},
  {id:'nb',  nome:'Fórum do Núcleo Bandeirante',lat:-15.86881, lng:-47.96081, r:4.2},
  {id:'agc', nome:'Fórum de Águas Claras',      lat:-15.83906, lng:-48.01306, r:4.4},
  {id:'tag', nome:'Fórum de Taguatinga',        lat:-15.82119, lng:-48.06681, r:4.2},
  {id:'cei', nome:'Fórum de Ceilândia',         lat:-15.81856, lng:-48.10269, r:4.2},
  {id:'sam', nome:'Fórum de Samambaia',         lat:-15.88231, lng:-48.08431, r:4.0},
  {id:'rec', nome:'Fórum do Recanto das Emas',  lat:-15.90744, lng:-48.07369, r:4.0},
  {id:'rf',  nome:'Fórum do Riacho Fundo',      lat:-15.88206, lng:-48.01094, r:5.0},
  {id:'sse', nome:'Fórum de São Sebastião',     lat:-15.90419, lng:-47.77294, r:4.3},
  {id:'gam', nome:'Fórum do Gama',              lat:-16.00919, lng:-48.06169, r:4.3},
  {id:'sma', nome:'Fórum de Santa Maria',       lat:-16.01481, lng:-48.01294, r:4.4},
];
const byId = Object.fromEntries(FORUNS.map(f=>[f.id,f]));
const shortName = f => f.id==='sede' ? 'Milton Sebastião' : f.nome.replace(/^Fórum (de |do |da )?/,'');
const fmtKm = k => k.toFixed(1).replace('.',',');
const fmtMin = m => { m=Math.round(m); return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`; };
const haversine = (a,b)=>{const R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

// ---------- Mapa ----------
const map = L.map('map',{zoomControl:true}).setView([-15.83,-47.93],11);
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const esri=(path,opt={})=>L.tileLayer(ESRI+path+'/MapServer/tile/{z}/{y}/{x}',Object.assign({maxZoom:19,attribution:'Tiles © Esri, HERE, Garmin, © OpenStreetMap'},opt));
const bases = {
  'Mapa preto': esri('World_Topo_Map',{className:'dk-topo'}),
  'Mapa verde (relevo)': esri('World_Topo_Map'),
  'Mapa colorido': esri('World_Street_Map'),
  'Satélite': L.layerGroup([esri('World_Imagery'), esri('Reference/World_Transportation'), esri('Reference/World_Boundaries_and_Places')]),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
};
let current=null;
function setBase(name){ if(current) map.removeLayer(current); current=bases[name]; current.addTo(map); }
function applyPanel(mode){
  document.body.classList.toggle('light',mode==='light');
  document.getElementById('theme').textContent = mode==='light' ? '🌙 Mudar para modo escuro' : '☀️ Mudar para modo claro';
  try{localStorage.setItem('tema',mode);}catch(e){}
}
// trocar o fundo pelo botão de camadas também troca o tema da barra lateral
map.on('baselayerchange',e=>{current=e.layer; applyPanel(e.name==='Mapa preto'?'dark':'light');});
function setTheme(mode){
  applyPanel(mode);
  setBase(mode==='light' ? 'Mapa verde (relevo)' : 'Mapa preto');
}
document.getElementById('theme').onclick=()=>setTheme(document.body.classList.contains('light')?'dark':'light');
let temaInicial='dark'; try{temaInicial=localStorage.getItem('tema')||'dark';}catch(e){}
setTheme(temaInicial);
setBase('Satélite'); // abre sempre no satélite
L.control.layers(bases,null,{position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const routeLayer = L.layerGroup().addTo(map);
const markers = {};
function iconFor(f,cls=''){
  const pill = f.tag ? `🏛 ${f.tag}` : f.r ? `★ ${f.r.toFixed(1).replace('.',',')}` : '⚖';
  return L.divIcon({className:'',html:`<div class="pin ${cls}"><div class="pill">${pill}</div><div class="lbl">${shortName(f)}</div></div>`,iconSize:[0,0]});
}
FORUNS.forEach(f=>{
  const m = L.marker([f.lat,f.lng],{icon:iconFor(f),draggable:false,title:f.nome}).addTo(map);
  m.on('click',()=>pick(f.id));
  markers[f.id]=m;
});
const allBounds = L.latLngBounds(FORUNS.map(f=>[f.lat,f.lng])).pad(0.08);
map.fitBounds(allBounds);

// ---------- Rotas (OSRM) ----------
const OSRM='https://router.project-osrm.org';
const cache={};
async function getRoute(a,b){
  const key=`${a.lng},${a.lat};${b.lng},${b.lat}`;
  if(cache[key]) return cache[key];
  const r = await fetch(`${OSRM}/route/v1/driving/${key}?overview=full&geometries=geojson&steps=true`).then(r=>r.json());
  if(r.code!=='Ok') throw new Error(r.code);
  const rt=r.routes[0];
  const roads=[]; rt.legs[0].steps.forEach(s=>{const n=(s.ref||s.name||'').trim(); if(n && s.distance>400 && roads[roads.length-1]!==n) roads.push(n);});
  return cache[key]={km:rt.distance/1000, min:rt.duration/60, coords:rt.geometry.coordinates.map(c=>[c[1],c[0]]), roads};
}
async function getTable(src){
  const coords=FORUNS.map(f=>`${f.lng},${f.lat}`).join(';');
  const i=FORUNS.indexOf(src);
  const r=await fetch(`${OSRM}/table/v1/driving/${coords}?sources=${i}&annotations=distance,duration`).then(r=>r.json());
  if(r.code!=='Ok') throw new Error(r.code);
  return FORUNS.map((f,j)=>({f,km:r.distances[0][j]/1000,min:r.durations[0][j]/60}));
}

// ---------- Interface ----------
const selA=document.getElementById('selA'), selB=document.getElementById('selB');
[...FORUNS].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).forEach(f=>{
  selA.add(new Option(f.nome,f.id)); selB.add(new Option(f.nome,f.id));
});
[selA,selB].forEach(s=>s.add(new Option('— selecione —',''),0));
let A='sede', B='gua', seq=0;
selA.onchange=()=>{A=selA.value||null;update();};
selB.onchange=()=>{B=selB.value||null;update();};
document.getElementById('swap').onclick=()=>{[A,B]=[B,A];update();};
document.getElementById('clear').onclick=()=>{A=B=null;update();map.fitBounds(allBounds);};
document.getElementById('fit').onclick=()=>map.fitBounds(allBounds);
function pick(id){ if(!A||(A&&B)){A=id;B=null;} else if(id!==A){B=id;} update(); }

async function update(){
  const my=++seq;
  selA.value=A||''; selB.value=B||'';
  FORUNS.forEach(f=>{
    const cls = f.id===A?'a':f.id===B?'b':(A&&B?'dim':'');
    markers[f.id].setIcon(iconFor(f,cls));
    markers[f.id].setZIndexOffset(cls==='a'||cls==='b'?1000:0);
  });
  document.getElementById('hint').textContent = !A?'Clique em um fórum no mapa para definir a origem.':!B?'Agora clique no fórum de destino.':'Clique em outro fórum para começar uma nova rota.';
  routeLayer.clearLayers();

  // mais próximos
  const near=document.getElementById('near'), ul=document.getElementById('nearList');
  if(A){
    near.hidden=false; document.getElementById('nearTitle').textContent='Mais próximos — '+byId[A].nome;
    ul.innerHTML='<li class="loading">Calculando…</li>';
    getTable(byId[A]).then(list=>{
      if(my!==seq) return;
      ul.innerHTML='';
      list.filter(x=>x.f.id!==A).sort((x,y)=>x.km-y.km).slice(0,6).forEach(x=>{
        const li=document.createElement('li');
        li.innerHTML=`<span>${x.f.nome}</span><span>${fmtKm(x.km)} km · ${fmtMin(x.min)}</span>`;
        li.onclick=()=>{B=x.f.id;update();}; ul.appendChild(li);
      });
    }).catch(()=>{ if(my===seq) ul.innerHTML='<li class="loading">Sem conexão com o serviço de rotas.</li>'; });
  } else near.hidden=true;

  const res=document.getElementById('result'), body=document.getElementById('resBody');
  if(!(A&&B&&A!==B)){res.hidden=true;return;}
  const fa=byId[A], fb=byId[B];
  res.hidden=false; body.innerHTML='<div class="loading">Calculando rota…</div>';
  document.getElementById('gm').href=`https://www.google.com/maps/dir/?api=1&origin=${fa.lat},${fa.lng}&destination=${fb.lat},${fb.lng}&travelmode=driving`;
  const line=haversine(fa,fb);
  try{
    const r=await getRoute(fa,fb);
    if(my!==seq) return;
    L.polyline(r.coords,{color:'#0b57d0',weight:10,opacity:.35}).addTo(routeLayer);
    const pl=L.polyline(r.coords,{color:'#4c8dff',weight:6}).addTo(routeLayer);
    const mid=r.coords[Math.floor(r.coords.length/2)];
    L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:`<div class="route-tag">${fmtKm(r.km)} km · ${fmtMin(r.min)}</div>`,iconSize:[0,0]})}).addTo(routeLayer);
    map.fitBounds(pl.getBounds().pad(0.25),{paddingTopLeft:[20,20]});
    body.innerHTML=`<div class="big">${fmtKm(r.km)}<small>km</small></div>
      <div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>${fmtMin(r.min)}</b><span>Tempo (sem trânsito)</span></div></div>
      <div class="via"><b style="color:var(--text)">${fa.nome}</b> → <b style="color:var(--text)">${fb.nome}</b>${r.roads.length?'<br>Via: '+r.roads.slice(0,6).join(' → '):''}</div>`;
  }catch(e){
    if(my!==seq) return;
    L.polyline([[fa.lat,fa.lng],[fb.lat,fb.lng]],{color:'#4c8dff',weight:4,dashArray:'8 8'}).addTo(routeLayer);
    body.innerHTML=`<div class="big">${fmtKm(line*1.3)}<small>km (aprox.)</small></div>
      <div class="via">Não foi possível acessar o serviço de rotas agora; este valor é aproximado. Verifique a internet ou use o link abaixo.</div>`;
  }
}
update();
</script>
</body>
</html>
